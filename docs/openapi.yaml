          anyOf:
          - type: integer
          - type: 'null'
          title: First Invalid Id
      type: object
      required:
      - checked
      - valid
      - first_invalid_id
      title: AuditChainOut
    AuditLogOut:
      properties:
        id:
          type: integer
          title: Id
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        actor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Actor Id
        actor_role:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Role
        action:
          type: string
          title: Action
        resource_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Type
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        hash:
          type: string
          title: Hash
      type: object
      required:
      - id
      - occurred_at
      - actor_id
      - actor_role
      - action
      - resource_type
      - resource_id
      - ip
      - request_id
      - metadata
      - hash
      title: AuditLogOut
    BookingIn:
      properties:
        slot_id:
          type: string
          format: uuid
          title: Slot Id
        chief_complaint:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Chief Complaint
        consent_to_teleconsultation:
          type: boolean
          const: true
          title: Consent To Teleconsultation
          description: Explicit patient consent required by TPG 2020 before a teleconsultation
      additionalProperties: false
      type: object
      required:
      - slot_id
      - consent_to_teleconsultation
      title: BookingIn
    BookingOut:
      properties:
        consultation:
          $ref: '#/components/schemas/ConsultationOut'
        payment:
          anyOf:
          - $ref: '#/components/schemas/PaymentOut'
          - type: 'null'
        checkout_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Checkout Url
        hold_expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Hold Expires At
      type: object
      required:
      - consultation
      - payment
      - checkout_url
      - hold_expires_at
      title: BookingOut
