openapi: 3.1.0
info:
  title: Amrutam Telemedicine API
  description: Auth, doctor availability, booking, consultations, prescriptions and
    audit.
  version: 0.1.0
paths:
  /v1/auth/register:
    post:
      tags:
      - auth
      summary: Register
      operationId: register_v1_auth_register_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Client-generated unique key (e.g. UUIDv4). Retries must reuse
            it.
          title: Idempotency-Key
        description: Client-generated unique key (e.g. UUIDv4). Retries must reuse
          it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/mfa/verify:
    post:
      tags:
      - auth
      summary: Verify Mfa
      operationId: verify_mfa_v1_auth_mfa_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/mfa/setup:
    post:
      tags:
      - auth
      summary: Setup Mfa
      operationId: setup_mfa_v1_auth_mfa_setup_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
      security:
      - HTTPBearer: []
  /v1/auth/mfa/enable:
    post:
      tags:
      - auth
      summary: Enable Mfa
      operationId: enable_mfa_v1_auth_mfa_enable_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnableResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh
      operationId: refresh_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/users/me:
    get:
      tags:
      - users
      summary: Get Me
      operationId: get_me_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
      security:
      - HTTPBearer: []
  /v1/users/me/profile:
    patch:
      tags:
      - users
      summary: Update My Profile
      operationId: update_my_profile_v1_users_me_profile_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/users/me/data-export:
    get:
      tags:
      - privacy (DPDP)
      summary: Export My Data
      description: 'Right of access: everything held about the caller, decrypted,
        in one JSON document.'
      operationId: export_my_data_v1_users_me_data_export_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Export My Data V1 Users Me Data Export Get
      security:
      - HTTPBearer: []
  /v1/users/me/erasure:
    post:
      tags:
      - privacy (DPDP)
      summary: Erase My Account
      description: 'Right to erasure. Identity/contact data is removed and the account
        closed; clinical

        records are retained as medical-records rules require. Requires the password
        again.'
      operationId: erase_my_account_v1_users_me_erasure_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErasureIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/doctors/me:
    get:
      tags:
      - doctor self-service
      summary: Get My Practice
      operationId: get_my_practice_v1_doctors_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorOwnOut'
      security:
      - HTTPBearer: []
    put:
      tags:
      - doctor self-service
      summary: Submit My Practice
      description: 'Create or replace the practice profile. Changing registration
        details on a verified

        profile sends it back to ``pending`` for re-verification.'
      operationId: submit_my_practice_v1_doctors_me_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorProfileIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorOwnOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/doctors/me/accepting:
    patch:
      tags:
      - doctor self-service
      summary: Toggle Accepting
      operationId: toggle_accepting_v1_doctors_me_accepting_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptingUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorOwnOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/doctors/me/slots:
    post:
      tags:
      - doctor self-service
      summary: Publish Slots
      operationId: publish_slots_v1_doctors_me_slots_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Client-generated unique key (e.g. UUIDv4). Retries must reuse
            it.
          title: Idempotency-Key
        description: Client-generated unique key (e.g. UUIDv4). Retries must reuse
          it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotBatchIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotBatchOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - doctor self-service
      summary: List My Slots
      operationId: list_my_slots_v1_doctors_me_slots_get
      security:
      - HTTPBearer: []
      parameters:
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SlotStatus'
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotOut'
                title: Response List My Slots V1 Doctors Me Slots Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/doctors/me/slots/{slot_id}:
    delete:
      tags:
      - doctor self-service
      summary: Remove Slot
      operationId: remove_slot_v1_doctors_me_slots__slot_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/doctors:
    get:
      tags:
      - doctor discovery
      summary: Search Doctors
      description: Search verified doctors who are accepting consultations. Cached
        for up to 30s.
      operationId: search_doctors_v1_doctors_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Name, specialty or keyword
          title: Q
        description: Name, specialty or keyword
      - name: specialty
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Specialty
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
      - name: min_fee
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Min Fee
      - name: max_fee
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Max Fee
      - name: min_rating
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 5
            minimum: 0
          - type: 'null'
          title: Min Rating
      - name: available_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Available From
      - name: available_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Available To
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DoctorSort'
          default: relevance
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorSearchPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/doctors/specialties:
    get:
      tags:
      - doctor discovery
      summary: List Specialties
      operationId: list_specialties_v1_doctors_specialties_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response List Specialties V1 Doctors Specialties Get
  /v1/doctors/{doctor_id}:
    get:
      tags:
      - doctor discovery
      summary: Get Doctor
      operationId: get_doctor_v1_doctors__doctor_id__get
      parameters:
      - name: doctor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Doctor Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorPublic'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/doctors/{doctor_id}/slots:
    get:
      tags:
      - doctor discovery
      summary: List Doctor Slots
      description: 'Open slots only. Not cached: this is what the patient picks from
        right before booking.'
      operationId: list_doctor_slots_v1_doctors__doctor_id__slots_get
      parameters:
      - name: doctor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Doctor Id
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicSlotOut'
                title: Response List Doctor Slots V1 Doctors  Doctor Id  Slots Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consultations:
    post:
      tags:
      - consultations
      summary: Book Consultation
      description: 'Hold the slot and start payment. The slot is held for 10 minutes;
        the consultation is

        confirmed by the payment webhook. Retrying (same key or same slot) resumes
        the booking.'
      operationId: book_consultation_v1_consultations_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Client-generated unique key (e.g. UUIDv4). Retries must reuse
            it.
          title: Idempotency-Key
        description: Client-generated unique key (e.g. UUIDv4). Retries must reuse
          it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - consultations
      summary: List My Consultations
      operationId: list_my_consultations_v1_consultations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ConsultationStatus'
          - type: 'null'
          title: Status
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Before
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consultations/{consultation_id}:
    get:
      tags:
      - consultations
      summary: Get Consultation
      operationId: get_consultation_v1_consultations__consultation_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: consultation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Consultation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consultations/{consultation_id}/cancel:
    post:
      tags:
      - consultations
      summary: Cancel Consultation
      description: 'Patients get a full refund up to 2h before the start; doctor/admin
        cancellations are

        always refunded. The slot reopens for other patients.'
      operationId: cancel_consultation_v1_consultations__consultation_id__cancel_post
      security:
      - HTTPBearer: []
      parameters:
      - name: consultation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Consultation Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Client-generated unique key (e.g. UUIDv4). Retries must reuse
            it.
          title: Idempotency-Key
        description: Client-generated unique key (e.g. UUIDv4). Retries must reuse
          it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consultations/{consultation_id}/start:
    post:
      tags:
      - consultations
      summary: Start Consultation
      operationId: start_consultation_v1_consultations__consultation_id__start_post
      security:
      - HTTPBearer: []
      parameters:
      - name: consultation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Consultation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consultations/{consultation_id}/join:
    get:
      tags:
      - consultations
      summary: Join Consultation
      operationId: join_consultation_v1_consultations__consultation_id__join_get
      security:
      - HTTPBearer: []
      parameters:
      - name: consultation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Consultation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consultations/{consultation_id}/complete:
    post:
      tags:
      - consultations
      summary: Complete Consultation
      operationId: complete_consultation_v1_consultations__consultation_id__complete_post
      security:
      - HTTPBearer: []
      parameters:
      - name: consultation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Consultation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consultations/{consultation_id}/no-show:
    post:
      tags:
      - consultations
      summary: Mark No Show
      operationId: mark_no_show_v1_consultations__consultation_id__no_show_post
      security:
      - HTTPBearer: []
      parameters:
      - name: consultation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Consultation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consultations/{consultation_id}/review:
    post:
      tags:
      - consultations
      summary: Review Consultation
      operationId: review_consultation_v1_consultations__consultation_id__review_post
      security:
      - HTTPBearer: []
      parameters:
      - name: consultation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Consultation Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Client-generated unique key (e.g. UUIDv4). Retries must reuse
            it.
          title: Idempotency-Key
        description: Client-generated unique key (e.g. UUIDv4). Retries must reuse
          it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/medicines:
    get:
      tags:
      - prescriptions
      summary: Search Medicines
      operationId: search_medicines_v1_medicines_get
      security:
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
