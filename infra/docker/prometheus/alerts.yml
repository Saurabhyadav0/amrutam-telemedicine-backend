# SLOs: availability 99.95% (error budget 0.05%), p95 reads < 200ms, p95 writes < 500ms.
# Burn-rate alerts follow the Google SRE Workbook multi-window, multi-burn-rate pattern.
groups:
  - name: amrutam-slo-recording
    interval: 30s
    rules:
      - record: slo:http_error_ratio:rate5m
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1e-9)
      - record: slo:http_error_ratio:rate30m
        expr: sum(rate(http_requests_total{status=~"5.."}[30m])) / clamp_min(sum(rate(http_requests_total[30m])), 1e-9)
      - record: slo:http_error_ratio:rate1h
        expr: sum(rate(http_requests_total{status=~"5.."}[1h])) / clamp_min(sum(rate(http_requests_total[1h])), 1e-9)
      - record: slo:http_error_ratio:rate6h
        expr: sum(rate(http_requests_total{status=~"5.."}[6h])) / clamp_min(sum(rate(http_requests_total[6h])), 1e-9)
      - record: slo:read_latency_p95:5m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{method="GET"}[5m])))
      - record: slo:write_latency_p95:5m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{method=~"POST|PUT|PATCH|DELETE"}[5m])))

  - name: amrutam-slo-alerts
    rules:
      - alert: AvailabilityBudgetFastBurn
        # 14.4x burn exhausts 2% of a 30-day budget in 1 hour.
        expr: slo:http_error_ratio:rate1h > (14.4 * 0.0005) and slo:http_error_ratio:rate5m > (14.4 * 0.0005)
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "5xx ratio burning the 99.95% error budget fast"
          runbook: "docs/runbooks/high-error-rate.md"
      - alert: AvailabilityBudgetSlowBurn
        expr: slo:http_error_ratio:rate6h > (6 * 0.0005) and slo:http_error_ratio:rate30m > (6 * 0.0005)
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "5xx ratio steadily consuming the error budget"
      - alert: ReadLatencyP95AboveSLO
        expr: slo:read_latency_p95:5m > 0.2
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "p95 GET latency {{ $value | humanizeDuration }} > 200ms"
      - alert: WriteLatencyP95AboveSLO
        expr: slo:write_latency_p95:5m > 0.5
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "p95 write latency {{ $value | humanizeDuration }} > 500ms"

  - name: amrutam-platform
    rules:
      - alert: ApiDown
        expr: up{job="amrutam-api"} == 0
        for: 1m
        labels: { severity: page }
        annotations: { summary: "API target {{ $labels.instance }} is down" }
      - alert: WorkerDown
        expr: up{job="amrutam-worker"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "Worker is down: refunds, notifications and hold expiry are stalled" }
      - alert: OutboxDeadLetters
        expr: increase(outbox_events_total{result="dead"}[15m]) > 0
        labels: { severity: ticket }
        annotations:
          summary: "{{ $value }} outbox events dead-lettered ({{ $labels.topic }})"
          description: "Inspect GET /v1/admin/outbox and retry once the cause is fixed."
      - alert: PaymentGatewayCircuitOpen
        expr: max by (dependency) (circuit_breaker_open) == 1
        for: 1m
        labels: { severity: page }
        annotations: { summary: "Circuit open for {{ $labels.dependency }}: bookings cannot take payment" }
      - alert: WebhookSignatureFailures
        expr: increase(payment_webhooks_total{outcome="bad_signature"}[10m]) > 5
        labels: { severity: ticket, security: "true" }
        annotations: { summary: "Repeated invalid payment webhook signatures (spoofing attempt or rotated secret)" }
      - alert: LoginFailureSpike
        expr: sum(increase(http_requests_total{handler="/v1/auth/login", status=~"401|423|429"}[5m])) > 200
        labels: { severity: ticket, security: "true" }
        annotations: { summary: "Spike in failed logins: possible credential stuffing" }
      - alert: CheckoutAbandonmentHigh
        expr: sum(increase(slot_holds_released_total[1h])) > 0.3 * sum(increase(bookings_total{outcome="held"}[1h]))
        for: 30m
        labels: { severity: ticket }
        annotations: { summary: "Over 30% of held slots expire unpaid: check the payment flow" }
