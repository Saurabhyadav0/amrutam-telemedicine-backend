global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: amrutam-api
    metrics_path: /metrics
    # One target per replica (Docker DNS returns every container behind "api").
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
  - job_name: amrutam-worker
    static_configs:
      - targets: ["worker:9100"]
